name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - sai
  pull_request:
    branches:
      - main
      - develop

# Minimal permissions — read-only
permissions:
  contents: read

jobs:
  ci:
    name: Lint · Security · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check for dependency vulnerabilities
        # Advisory only — high/critical issues are surfaced but won't block for now.
        # Change --audit-level=high to make high-severity issues fail the pipeline.
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          # Supply via GitHub repository/environment secrets
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_PIN: ${{ secrets.VITE_ADMIN_PIN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
