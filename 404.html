<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NaviGO — Campus Navigation</title>
    <script>
      // Single Page Application routing fix for GitHub Pages
      // When GitHub Pages gets a 404 on a deep route, it serves this file.
      // This script redirects the user back to index.html with the path preserved.
      // Source: https://github.com/rafgraph/spa-github-pages

      var pathSegmentsToKeep = 1; // Number of path segments to keep (navigo-campus-navigation)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <noscript>
      <p>NaviGO requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </noscript>
  </body>
</html>
